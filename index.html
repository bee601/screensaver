<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Downloader - Full Resolution</title>
    <style>
        :root {
            --bg: #0f0f0f;
            --card: #1a1a1a;
            --border: #2a2a2a;
            --text: #e0e0e0;
            --accent: #ff0000;
            --accent-hover: #cc0000;
            --success: #00cc66;
            --error: #ff4444;
            --info: #4488ff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 750px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin: 30px 0 25px 0;
        }

        .header .logo {
            font-size: 2.5rem;
            margin-bottom: 5px;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ff0000, #ff5555);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: #777;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 22px;
            margin-bottom: 14px;
        }

        .card h3 {
            font-size: 0.95rem;
            color: #aaa;
            margin-bottom: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        .input-row input {
            flex: 1;
            padding: 13px 16px;
            background: #0f0f0f;
            border: 2px solid var(--border);
            border-radius: 10px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
        }

        .input-row input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(255,0,0,0.1);
        }

        .input-row input::placeholder {
            color: #444;
        }

        .btn {
            padding: 13px 24px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            letter-spacing: 0.3px;
        }

        .btn:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(255,0,0,0.3);
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn:disabled {
            background: #333;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-success {
            background: #00aa44;
        }

        .btn-success:hover {
            background: #008833;
            box-shadow: 0 4px 15px rgba(0,170,68,0.3);
        }

        .info-row {
            display: flex;
            gap: 14px;
            align-items: flex-start;
        }

        .thumbnail-container {
            width: 180px;
            flex-shrink: 0;
            aspect-ratio: 16/9;
            border-radius: 10px;
            overflow: hidden;
            background: #0a0a0a;
            position: relative;
        }

        .thumbnail-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .duration-badge {
            position: absolute;
            bottom: 6px;
            right: 6px;
            background: rgba(0,0,0,0.85);
            color: #fff;
            padding: 3px 7px;
            border-radius: 5px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .info-text {
            flex: 1;
            min-width: 0;
        }

        .info-text .title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 6px;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .info-text .meta {
            font-size: 0.85rem;
            color: #888;
            line-height: 1.5;
        }

        .info-text .meta strong {
            color: #aaa;
        }

        .quality-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 8px;
        }

        .quality-option {
            padding: 14px 10px;
            background: #111;
            border: 2px solid #222;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            position: relative;
        }

        .quality-option:hover {
            border-color: #444;
            background: #181818;
        }

        .quality-option.selected {
            border-color: var(--accent);
            background: rgba(255,0,0,0.08);
        }

        .quality-option .qlabel {
            font-weight: 700;
            font-size: 1rem;
            color: #ddd;
        }

        .quality-option .qmeta {
            font-size: 0.7rem;
            color: #666;
            display: block;
            margin-top: 3px;
        }

        .quality-option .qsize {
            font-size: 0.65rem;
            color: #555;
            display: block;
            margin-top: 2px;
        }

        .best-tag {
            position: absolute;
            top: 6px;
            right: 6px;
            background: var(--accent);
            color: #fff;
            font-size: 0.6rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 700;
        }

        .status {
            padding: 12px 16px;
            border-radius: 10px;
            margin-top: 10px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-info { background: #0a1a2a; color: #6ba4ff; border: 1px solid #1a3a5a; }
        .status-error { background: #1a0a0a; color: #ff6b6b; border: 1px solid #3a1a1a; }
        .status-success { background: #0a1a0a; color: #6fe18d; border: 1px solid #1a3a1a; }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid #333;
            border-top: 2px solid var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: inline-block;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .hidden { display: none !important; }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: #333;
            font-size: 0.8rem;
            padding-bottom: 20px;
        }

        .footer a { color: #555; text-decoration: none; }
        .footer a:hover { color: #888; }

        .format-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }

        .format-tab {
            padding: 8px 16px;
            background: #111;
            border: 1px solid #222;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            color: #888;
            transition: all 0.2s;
        }

        .format-tab:hover {
            color: #ccc;
            border-color: #444;
        }

        .format-tab.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        @media (max-width: 600px) {
            .info-row { flex-direction: column; }
            .thumbnail-container { width: 100%; }
            .input-row { flex-direction: column; }
            .quality-grid { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">⬇️</div>
            <h1>Video Downloader</h1>
            <p>Full Resolution • No Watermarks • All Platforms</p>
        </div>

        <!-- URL Input -->
        <div class="card">
            <h3>🔗 Video URL</h3>
            <div class="input-row">
                <input 
                    type="text" 
                    id="urlInput" 
                    placeholder="https://www.youtube.com/watch?v=... or any video link"
                    autocomplete="off"
                >
                <button class="btn" id="fetchBtn" onclick="fetchVideoInfo()">
                    <span id="fetchText">Analyze</span>
                    <span id="fetchSpinner" class="spinner hidden"></span>
                </button>
            </div>
            <div id="statusBox"></div>
        </div>

        <!-- Video Info -->
        <div class="card hidden" id="infoCard">
            <h3>📺 Video Information</h3>
            <div class="info-row">
                <div class="thumbnail-container">
                    <img id="thumbImg" src="" alt="Thumbnail">
                    <span class="duration-badge" id="durationBadge"></span>
                </div>
                <div class="info-text">
                    <div class="title" id="videoTitle"></div>
                    <div class="meta" id="videoMeta"></div>
                </div>
            </div>
        </div>

        <!-- Format Tabs -->
        <div class="card hidden" id="formatCard">
            <h3>📁 Format</h3>
            <div class="format-tabs">
                <div class="format-tab active" data-format="all" onclick="switchFormat('all', this)">All</div>
                <div class="format-tab" data-format="video" onclick="switchFormat('video', this)">Video</div>
                <div class="format-tab" data-format="audio" onclick="switchFormat('audio', this)">Audio Only</div>
            </div>
            <div class="quality-grid" id="qualityGrid"></div>
        </div>

        <!-- Download Button -->
        <div class="card hidden" id="downloadCard">
            <h3>⬇️ Download</h3>
            <button class="btn btn-success" id="downloadBtn" onclick="downloadVideo()" style="width:100%; font-size:1.1rem; padding:16px;">
                Download Selected Quality
            </button>
            <div class="status status-info hidden" id="dlStatus"></div>
        </div>

        <div class="footer">
            Video Downloader • No server required
        </div>
    </div>

    <script>
        // ============ STATE ============
        let currentVideo = null;
        let selectedFormat = null;
        let activeFormatFilter = 'all';

        // ============ API ENDPOINTS ============
        const CORS_PROXY = 'https://api.allorigins.win/raw?url=';
        const INVIDIOUS_INSTANCES = [
            'https://inv.nadeko.net',
            'https://invidious.fdn.fr',
            'https://vid.puffyan.us',
            'https://invidious.privacyredirect.com',
        ];

        // ============ FETCH VIDEO INFO ============
        async function fetchVideoInfo() {
            const url = document.getElementById('urlInput').value.trim();
            if (!url) return showStatus('Please enter a video URL', 'error');

            setLoading(true);
            clearUI();
            showStatus('Fetching video information...', 'info');

            try {
                let data = null;
                
                // Try YouTube
                const ytId = extractYouTubeID(url);
                if (ytId) {
                    data = await fetchYouTubeViaInvidious(ytId);
                }
                
                // Try generic
                if (!data) {
                    data = await fetchGenericVideo(url);
                }

                if (!data || !data.formats || data.formats.length === 0) {
                    throw new Error('No downloadable formats found for this URL.');
                }

                currentVideo = data;
                displayVideoInfo(data);
                displayFormats(data);
                
                document.getElementById('infoCard').classList.remove('hidden');
                document.getElementById('formatCard').classList.remove('hidden');
                document.getElementById('downloadCard').classList.remove('hidden');
                
                showStatus(`Found ${data.formats.length} formats. Select quality to download.`, 'success');
                
            } catch (err) {
                showStatus('Error: ' + err.message, 'error');
            }

            setLoading(false);
        }

        async function fetchYouTubeViaInvidious(videoId) {
            for (let instance of INVIDIOUS_INSTANCES) {
                try {
                    const apiUrl = `${instance}/api/v1/videos/${videoId}`;
                    const proxyUrl = CORS_PROXY + encodeURIComponent(apiUrl);
                    
                    const resp = await fetch(proxyUrl);
                    if (!resp.ok) continue;
                    
                    const data = await resp.json();
                    
                    const formats = [];
                    
                    // Combined formats (video + audio)
                    if (data.formatStreams) {
                        for (let f of data.formatStreams) {
                            formats.push({
                                quality: f.qualityLabel || f.quality,
                                label: f.qualityLabel || f.quality,
                                type: f.container || 'mp4',
                                mimeType: 'video/mp4',
                                resolution: f.resolution || f.qualityLabel,
                                size: formatSize(f.size),
                                sizeBytes: f.size || 0,
                                url: f.url,
                                hasAudio: true,
                                hasVideo: true,
                                itag: f.itag,
                                fps: f.fps || 30
                            });
                        }
                    }
                    
                    // Adaptive formats (video only or audio only)
                    if (data.adaptiveFormats) {
                        for (let f of data.adaptiveFormats) {
                            const isAudio = f.type?.includes('audio');
                            formats.push({
                                quality: isAudio ? f.bitrate + ' kbps' : (f.qualityLabel || f.quality),
                                label: isAudio ? 'Audio ' + f.encoding : (f.qualityLabel || f.quality),
                                type: f.container || 'mp4',
                                mimeType: f.type || 'video/mp4',
                                resolution: f.resolution || (isAudio ? 'Audio' : 'Unknown'),
                                size: formatSize(f.size),
                                sizeBytes: f.size || 0,
                                url: f.url,
                                hasAudio: isAudio,
                                hasVideo: !isAudio,
                                itag: f.itag,
                                fps: f.fps || 30,
                                encoding: f.encoding
                            });
                        }
                    }

                    // Sort: Best quality first
                    formats.sort((a, b) => {
                        const aRes = parseInt(a.resolution) || 0;
                        const bRes = parseInt(b.resolution) || 0;
                        return bRes - aRes;
                    });

                    return {
                        id: videoId,
                        title: data.title,
                        thumbnail: data.videoThumbnails?.[0]?.url?.replace('hqdefault', 'maxresdefault') 
                                   || `https://img.youtube.com/vi/${videoId}/maxresdefault.jpg`,
                        duration: data.lengthSeconds || 0,
                        durationFormatted: formatDuration(data.lengthSeconds || 0),
                        author: data.author,
                        authorUrl: data.authorUrl,
                        description: data.description,
                        formats: formats,
                        source: 'youtube'
                    };
                } catch (e) {
                    continue;
                }
            }
            return null;
        }

        async function fetchGenericVideo(url) {
            // Direct video URL detection
            const directVideoExts = ['.mp4', '.webm', '.mkv', '.avi', '.mov', '.flv', '.ts', '.m4v'];
            const isDirect = directVideoExts.some(ext => 
                url.toLowerCase().includes(ext) || url.toLowerCase().includes(ext + '?')
            );

            if (isDirect) {
                const fileName = url.split('/').pop().split('?')[0];
                return {
                    id: 'direct',
                    title: decodeURIComponent(fileName) || 'Video',
                    thumbnail: '',
                    duration: 0,
                    durationFormatted: 'Unknown',
                    author: 'Direct Link',
                    formats: [{
                        quality: 'Original',
                        label: 'Original Quality',
                        type: 'mp4',
                        mimeType: 'video/mp4',
                        resolution: 'Original',
                        size: 'Unknown',
                        sizeBytes: 0,
                        url: url,
                        hasAudio: true,
                        hasVideo: true,
                        itag: 0,
                        fps: 30
                    }],
                    source: 'direct'
                };
            }

            // Try page scraping for video sources
            try {
                const proxyUrl = CORS_PROXY + encodeURIComponent(url);
                const resp = await fetch(proxyUrl);
                const html = await resp.text();

                // Extract title
                let title = 'Video';
                const titleMatch = html.match(/<title[^>]*>([^<]+)<\/title>/i);
                if (titleMatch) title = titleMatch[1].trim();

                // Extract OG data
                const ogVideo = html.match(/property="og:video:url"[^>]+content="([^"]+)"/i);
                const ogVideoAlt = html.match(/property="og:video"[^>]+content="([^"]+)"/i);
                const videoSrc = html.match(/<source[^>]+src="([^"]+\.mp4[^"]*)"/i);
                const videoSrc2 = html.match(/src="([^"]+\.(?:mp4|webm|m3u8)[^"]*)"/i);

                const foundUrl = ogVideo?.[1] || ogVideoAlt?.[1] || videoSrc?.[1] || videoSrc2?.[1];

                if (foundUrl) {
                    return {
                        id: 'web',
                        title: title,
                        thumbnail: '',
                        duration: 0,
                        durationFormatted: 'Unknown',
                        author: 'Web Video',
                        formats: [{
                            quality: 'Original',
                            label: 'Original Quality',
                            type: 'mp4',
                            mimeType: 'video/mp4',
                            resolution: 'Original',
                            size: 'Unknown',
                            sizeBytes: 0,
                            url: foundUrl.startsWith('http') ? foundUrl : new URL(foundUrl, url).href,
                            hasAudio: true,
                            hasVideo: true,
                            itag: 0,
                            fps: 30
                        }],
                        source: 'web'
                    };
                }
            } catch (e) {}

            return null;
        }

        // ============ HELPER FUNCTIONS ============
        function extractYouTubeID(url) {
            const patterns = [
                /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/v\/|youtube\.com\/shorts\/|m\.youtube\.com\/watch\?v=)([a-zA-Z0-9_-]{11})/,
                /youtube\.com\/watch\?.*[?&]v=([a-zA-Z0-9_-]{11})/,
                /^([a-zA-Z0-9_-]{11})$/
            ];
            for (let p of patterns) {
                const match = url.match(p);
                if (match) return match[1];
            }
            return null;
        }

        function formatDuration(seconds) {
            if (!seconds || seconds <= 0) return 'Unknown';
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            return `${m}:${String(s).padStart(2,'0')}`;
        }

        function formatSize(bytes) {
            if (!bytes || bytes <= 0) return 'Unknown';
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
            if (bytes < 1073741824) return (bytes / 1048576).toFixed(1) + ' MB';
            return (bytes / 1073741824).toFixed(2) + ' GB';
        }

        // ============ UI FUNCTIONS ============
        function displayVideoInfo(data) {
            document.getElementById('thumbImg').src = data.thumbnail || '';
            document.getElementById('videoTitle').textContent = data.title;
            document.getElementById('durationBadge').textContent = data.durationFormatted || '';
            document.getElementById('videoMeta').innerHTML = 
                `<strong>Author:</strong> ${data.author || 'Unknown'}<br>
                 <strong>Source:</strong> ${data.source?.toUpperCase() || 'Unknown'}<br>
                 <strong>Formats:</strong> ${data.formats?.length || 0} available`;
        }

        function displayFormats(data) {
            const grid = document.getElementById('qualityGrid');
            grid.innerHTML = '';

            let formats = data.formats || [];

            // Filter by active tab
            if (activeFormatFilter === 'video') {
                formats = formats.filter(f => f.hasVideo && !f.hasAudio);
            } else if (activeFormatFilter === 'audio') {
                formats = formats.filter(f => f.hasAudio && !f.hasVideo);
            }

            // Remove exact duplicates
            const seen = new Set();
            formats = formats.filter(f => {
                const key = f.url || f.quality + f.type;
                if (seen.has(key)) return false;
                seen.add(key);
                return true;
            });

            if (formats.length === 0) {
                grid.innerHTML = '<div style="grid-column:1/-1;padding:20px;text-align:center;color:#666;">No formats available</div>';
                return;
            }

            formats.forEach((format, idx) => {
                const div = document.createElement('div');
                div.className = 'quality-option';
                div.innerHTML = `
                    ${idx === 0 && activeFormatFilter !== 'audio' ? '<span class="best-tag">BEST</span>' : ''}
                    <span class="qlabel">${format.label || format.quality}</span>
                    <span class="qmeta">${format.resolution || ''} ${format.fps > 30 ? format.fps + 'fps' : ''}</span>
                    <span class="qsize">${format.size || ''} ${format.type?.toUpperCase() || ''}</span>
                `;
                div.onclick = () => selectFormat(format, div);
                grid.appendChild(div);
            });
        }

        function selectFormat(format, element) {
            selectedFormat = format;
            document.querySelectorAll('.quality-option').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');

            const btn = document.getElementById('downloadBtn');
            btn.textContent = `Download: ${format.label || format.quality} (${format.size || 'Unknown'})`;
        }

        function switchFormat(filter, element) {
            activeFormatFilter = filter;
            document.querySelectorAll('.format-tab').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            if (currentVideo) displayFormats(currentVideo);
        }

        function downloadVideo() {
            if (!selectedFormat) {
                return showStatus('Please select a quality first!', 'error');
            }

            const url = selectedFormat.url;
            if (!url) {
                return showStatus('Download URL not available.', 'error');
            }

            // Determine file extension
            let ext = '.mp4';
            if (selectedFormat.type) ext = '.' + selectedFormat.type;
            if (selectedFormat.mimeType?.includes('webm')) ext = '.webm';
            if (selectedFormat.mimeType?.includes('audio')) ext = selectedFormat.type === 'webm' ? '.weba' : '.m4a';
            if (selectedFormat.hasAudio && !selectedFormat.hasVideo) ext = '.m4a';

            const fileName = (currentVideo?.title || 'video')
                .replace(/[<>:"/\\|?*]/g, '')
                .substring(0, 100) + ext;

            // Method 1: Direct download
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            document.body.appendChild(a);
            a.click();
            
            setTimeout(() => {
                document.body.removeChild(a);
            }, 100);

            // Method 2: Open in new tab as fallback
            setTimeout(() => {
                window.open(url, '_blank');
            }, 500);

            showStatus('Download started! If it doesn\'t start, right-click the link and "Save As..."', 'success');
        }

        function showStatus(msg, type) {
            const box = document.getElementById('statusBox');
            box.innerHTML = `<div class="status status-${type}">${msg}</div>`;
            
            if (type === 'success' || type === 'error') {
                setTimeout(() => {
                    if (box.textContent === msg) box.innerHTML = '';
                }, 6000);
            }
        }

        function setLoading(loading) {
            const btn = document.getElementById('fetchBtn');
            const text = document.getElementById('fetchText');
            const spinner = document.getElementById('fetchSpinner');
            
            btn.disabled = loading;
            text.classList.toggle('hidden', loading);
            spinner.classList.toggle('hidden', !loading);
        }

        function clearUI() {
            ['infoCard', 'formatCard', 'downloadCard'].forEach(id => 
                document.getElementById(id).classList.add('hidden')
            );
            document.getElementById('qualityGrid').innerHTML = '';
            currentVideo = null;
            selectedFormat = null;
        }

        // ============ EVENT LISTENERS ============
        document.getElementById('urlInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') fetchVideoInfo();
        });

        // Auto-paste detection
        document.addEventListener('paste', (e) => {
            const input = document.getElementById('urlInput');
            if (document.activeElement === input) return;
            
            const text = (e.clipboardData || window.clipboardData).getData('text');
            if (text && (text.includes('youtube.com') || text.includes('youtu.be') || 
                text.includes('.mp4') || text.includes('video'))) {
                input.value = text.trim();
                fetchVideoInfo();
            }
        });
    </script>
</body>
</html>
