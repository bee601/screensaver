<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bildschirmschoner</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: black;
    }

    video {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover; /* Füllt den gesamten Bildschirm */
        background: black;
    }
</style>
</head>
<body>

<video autoplay muted loop playsinline>
    <source src="The_One_Ring.mp4" type="video/mp4">
    Dein Browser unterstützt keine Videos.
</video>

<script>
const video = document.querySelector("video");

// Falls Autoplay blockiert wird
video.play().catch(() => {
    document.body.addEventListener("click", () => {
        video.play();
    }, { once: true });
});

// Taste F für Browser-Vollbild
document.addEventListener("keydown", (e) => {
    if (e.key.toLowerCase() === "f") {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen();
        } else {
            document.exitFullscreen();
        }
    }
});
</script>

</body>
</html>
